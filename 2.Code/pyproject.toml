[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrotor-mpc-sim"
version = "2.0.1"
description = "Reproducible deterministic and chance-constrained MPC research workbench"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "PyYAML>=6.0,<7.0",
    "matplotlib>=3.8,<4.0",
    "plotly>=5.20,<7.0",
    "cvxpy>=1.5,<2.0",
    "clarabel>=0.9,<1.0",
    "osqp>=0.6,<2.0",
]

[project.optional-dependencies]
qp = ["cvxpy>=1.5,<2.0", "clarabel>=0.9,<1.0", "osqp>=0.6,<2.0"]
ui = [
    "casadi>=3.6,<4.0", "do-mpc>=4.6,<6.0",
    "graphviz>=0.20,<1.0", "PySide6>=6.7,<7.0", "pyqtgraph>=0.13.7,<1.0",
]
mujoco = ["mujoco>=3.2,<4.0"]
video = [
    "imageio>=2.34,<3.0", "imageio-ffmpeg>=0.4.9,<1.0", "Pillow>=10.0,<12.0",
]
notebooks = [
    "jupyterlab>=4.2,<5.0", "ipykernel>=6.29,<8.0", "nbclient>=0.10,<1.0",
    "nbformat>=5.10,<6.0",
]
dev = ["pytest>=8,<10", "ruff==0.16.0", "mypy>=1.10,<2.0", "build>=1.2,<2.0"]
full = [
    "cvxpy>=1.5,<2.0", "clarabel>=0.9,<1.0", "osqp>=0.6,<2.0",
    "casadi>=3.6,<4.0", "do-mpc>=4.6,<6.0",
    "graphviz>=0.20,<1.0", "mujoco>=3.2,<4.0", "PySide6>=6.7,<7.0",
    "pyqtgraph>=0.13.7,<1.0",
    "imageio>=2.34,<3.0", "imageio-ffmpeg>=0.4.9,<1.0", "Pillow>=10.0,<12.0",
]

[project.scripts]
quadrotor-mpc-native = "simulation.interfaces.cli.native:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["simulation*", "visualization*"]

[tool.setuptools.data-files]
"share/quadrotor-mpc-sim/config" = [
    "config/controller.yaml",
    "config/mujoco_native.yaml",
    "config/mujoco_native_ccmpc.yaml",
    "config/mujoco_native_dynamic.yaml",
    "config/mujoco_native_estimation.yaml",
    "config/native_monte_carlo.yaml",
]
"share/quadrotor-mpc-sim/config/scenarios" = ["config/scenarios/*.yaml"]
"share/quadrotor-mpc-sim/models/bitcraze_crazyflie_2" = [
    "models/bitcraze_crazyflie_2/CHANGELOG.md",
    "models/bitcraze_crazyflie_2/LICENSE",
    "models/bitcraze_crazyflie_2/README.md",
    "models/bitcraze_crazyflie_2/README_WORKBENCH.md",
    "models/bitcraze_crazyflie_2/cf2.png",
    "models/bitcraze_crazyflie_2/cf2.xml",
    "models/bitcraze_crazyflie_2/scene.xml",
]
"share/quadrotor-mpc-sim/models/bitcraze_crazyflie_2/assets" = [
    "models/bitcraze_crazyflie_2/assets/*.obj",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B905"]
